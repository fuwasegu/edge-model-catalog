    url: https://huggingface.co/ccore/Qwen3.5-4B-3D-Coder
    params_b: 4.0
    license: Apache-2.0
    base_model: Qwen3.5-4B
    categories: [3d-generation, code-generation]
    modality: [text, 3d]
    released: 2026-10-25
    verified: 2026-11-09
    status: covered
    hook: Fine-tune that writes Three.js 3D scenes as a single HTML file.
    hook_ja: "Three.js の3Dシーンを単一のHTMLファイルとして書き出すファインチューン。"
