# edge-model-catalog seed data
# Small / edge models (roughly <= 4B params), organized by use case.
# Every entry was verified against its primary source (model card / official post).
# Fields:
#   id:         unique slug
#   name:       model name
#   provider:   author / organization
#   url:        primary source (Hugging Face model page etc.)
#   params_b:   parameter count in billions (approx., omit if unknown)
#   license:    license of the weights (see license_note for split licenses)
#   base_model: base model, if a fine-tune / derivative (omit if trained from scratch)
#   categories: use-case tags (see README.md for the vocabulary)
#   modality:   text / image / audio / video / 3d
#   released:   first public release date (YYYY-MM-DD, approx. where noted)
#   verified:   date the primary source was last checked
#   status:     covered = written up in depth / candidate = card-read, not yet covered
#   hook:       one line: what makes it interesting
#   caveats:    honest limitations from the primary source (optional)
models:
